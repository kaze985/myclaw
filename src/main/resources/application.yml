spring:
  application:
    name: myclaw
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
# springdoc-openapi????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.lppnb.ai.myclaw.controller
# knife4j???????????????
knife4j:
  enable: true
  setting:
    language: zh_cn
server:
  servlet:
    context-path: /api
  port: 8080