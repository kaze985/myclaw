spring:
  application:
    name: myclaw
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.lppnb.ai.myclaw.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
server:
  servlet:
    context-path: /api
  port: 8080
tools:
  tavily:
    api-key: ${TAVILY_API_KEY}
  file:
    download-dir: ${user.dir}/tmp/file
  terminal:
    allowed-commands: echo,ls,dir,pwd,cat,grep,curl,java,mvn